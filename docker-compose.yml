version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repomedic-backend
    ports:
      - "8000:8000"
    environment:
      - REPOMEDIC_ENV=development
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
    volumes:
      - ./backend:/app
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - repomedic-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: repomedic-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_BASE_URL=ws://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - repomedic-network

networks:
  repomedic-network:
    driver: bridge
